name: Deploy website via SFTP

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  deploy:
    name: Upload website
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare deploy folder
        run: |
          DEPLOY_DIR="$RUNNER_TEMP/deploy"

          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"

          find . -type f \( \
            -iname '*.php' -o \
            -iname '*.html' -o \
            -iname '*.css' -o \
            -iname '*.js' -o \
            -iname '*.json' -o \
            -iname '*.png' -o \
            -iname '*.jpg' -o \
            -iname '*.jpeg' -o \
            -iname '*.gif' -o \
            -iname '*.svg' -o \
            -iname '*.ico' -o \
            -iname '*.webp' -o \
            -iname '*.otf' -o \
            -iname '*.ttf' -o \
            -iname '*.woff' -o \
            -iname '*.woff2' -o \
            -iname '*.webmanifest' \
          \) -print0 | rsync -av --from0 --files-from=- ./ "$DEPLOY_DIR/"

      - name: Show deploy contents
        run: |
          echo "Deploy folder contents:"
          find "$RUNNER_TEMP/deploy" -maxdepth 4 -print | sort

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SFTP_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SFTP_PORT }}" "${{ secrets.SFTP_SERVER }}" >> ~/.ssh/known_hosts

      - name: Deploy via SFTP
        # Uses the OpenSSH sftp client that is already on the runner, so nothing
        # has to be installed first (apt-get update could hang for a long time).
        timeout-minutes: 10
        run: |
          REMOTE_DIR="${{ secrets.SFTP_REMOTE_DIR }}"
          {
            echo "-mkdir \"$REMOTE_DIR\""
            echo "lcd \"$RUNNER_TEMP/deploy\""
            echo "put -r * \"$REMOTE_DIR/\""
            echo "bye"
          } > "$RUNNER_TEMP/sftp-batch.txt"
          cat "$RUNNER_TEMP/sftp-batch.txt"
          sftp -b "$RUNNER_TEMP/sftp-batch.txt" \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -P "${{ secrets.SFTP_PORT }}" \
            "${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_SERVER }}"
